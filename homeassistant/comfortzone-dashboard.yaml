title: Comfortzone EX
views:
  - title: Schema
    path: schema
    icon: mdi:heat-pump
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:comfortzone-card
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: entities
            title: Steuerung
            show_header_toggle: false
            entities:
              - entity: select.technikkeller_comfortzone_ex_fan_speed_setting
                name: Lüfterstufe
              - entity: number.technikkeller_comfortzone_ex_hot_water_target_setting
                name: Warmwasser-Soll
              - entity: number.technikkeller_comfortzone_ex_room_setpoint_setting
                name: Raum-Soll
              - entity: switch.technikkeller_comfortzone_ex_hot_water_extra
                name: WW Extra (55 °C)
              - entity: switch.technikkeller_comfortzone_ex_legionella_prevention
                name: Legionellenprävention (65 °C)
      - type: grid
        cards:
          - type: history-graph
            title: Temperaturen (24 h)
            hours_to_show: 24
            entities:
              - entity: sensor.technikkeller_comfortzone_ex_outdoor_temperature
                name: Außen
              - entity: sensor.technikkeller_comfortzone_ex_flow_temperature
                name: Vorlauf
              - entity: sensor.technikkeller_comfortzone_ex_return_temperature
                name: Rücklauf
              - entity: sensor.technikkeller_comfortzone_ex_hot_water_temperature
                name: Warmwasser
      - type: grid
        cards:
          - type: history-graph
            title: Leistung (24 h)
            hours_to_show: 24
            entities:
              - entity: sensor.technikkeller_comfortzone_ex_compressor_input_power
                name: Aufnahme
              - entity: sensor.technikkeller_comfortzone_ex_total_output_power
                name: Heizleistung
              - entity: sensor.technikkeller_comfortzone_ex_additional_heater_power
                name: Zusatzheizung
