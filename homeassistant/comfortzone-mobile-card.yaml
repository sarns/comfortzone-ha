type: vertical-stack
cards:
  - type: picture
    image: /local/comfortzone/comfortzone-ex-schema.png
    tap_action:
      action: none
    hold_action:
      action: none

  - type: glance
    title: Übersicht
    columns: 3
    show_name: true
    show_icon: true
    show_state: true
    entities:
      - entity: sensor.technikkeller_comfortzone_ex_indoor_temperature
        name: Raum
      - entity: sensor.technikkeller_comfortzone_ex_flow_temperature
        name: Vorlauf
      - entity: sensor.technikkeller_comfortzone_ex_calculated_flow_temperature
        name: Vorlauf berechnet
      - entity: sensor.technikkeller_comfortzone_ex_hot_water_temperature
        name: Warmwasser
      - entity: sensor.technikkeller_comfortzone_ex_outdoor_temperature
        name: Außen
      - entity: binary_sensor.technikkeller_comfortzone_ex_compressor_running
        name: Kompressor
      - entity: sensor.technikkeller_comfortzone_ex_total_output_power
        name: Heizleistung

  - type: entities
    title: Temperaturen
    show_header_toggle: false
    entities:
      - entity: sensor.technikkeller_comfortzone_ex_outdoor_temperature
        name: Außen
      - entity: sensor.technikkeller_comfortzone_ex_indoor_temperature
        name: Raum
      - entity: sensor.technikkeller_comfortzone_ex_room_setpoint
        name: Raum Soll
      - entity: sensor.technikkeller_comfortzone_ex_exhaust_air_temperature
        name: Abluft
      - entity: sensor.technikkeller_comfortzone_ex_evaporator_inlet_temperature
        name: Verdampfer Eingang
      - entity: sensor.technikkeller_comfortzone_ex_hot_gas_temperature
        name: Heißgas
      - entity: sensor.technikkeller_comfortzone_ex_exchanger_outlet_temperature
        name: Wärmetauscher Ausgang
      - entity: sensor.technikkeller_comfortzone_ex_flow_temperature
        name: Vorlauf
      - entity: sensor.technikkeller_comfortzone_ex_return_temperature
        name: Rücklauf
      - entity: sensor.technikkeller_comfortzone_ex_hot_water_temperature
        name: Warmwasser
      - entity: sensor.technikkeller_comfortzone_ex_hot_water_target
        name: Warmwasser Soll
      - entity: sensor.technikkeller_comfortzone_ex_active_hot_water_target
        name: Warmwasser Soll aktiv

  - type: entities
    title: Betrieb
    show_header_toggle: false
    entities:
      - entity: binary_sensor.technikkeller_comfortzone_ex_compressor_running
        name: Kompressor
      - entity: sensor.technikkeller_comfortzone_ex_compressor_frequency
        name: Frequenz
      - entity: sensor.technikkeller_comfortzone_ex_compressor_target_frequency
        name: Sollfrequenz
      - entity: sensor.technikkeller_comfortzone_ex_compressor_input_power
        name: Aufnahmeleistung
      - entity: sensor.technikkeller_comfortzone_ex_compressor_output_power
        name: Abgabeleistung
      - entity: sensor.technikkeller_comfortzone_ex_total_output_power
        name: Heizleistung
      - entity: sensor.technikkeller_comfortzone_ex_required_heating_power
        name: Erforderliche Leistung
      - entity: binary_sensor.technikkeller_comfortzone_ex_additional_heater_active
        name: Zusatzheizung
      - entity: sensor.technikkeller_comfortzone_ex_additional_heater_power
        name: Zusatzleistung
      - entity: binary_sensor.technikkeller_comfortzone_ex_hot_water_boost
        name: Warmwasser-Boost
      - entity: sensor.technikkeller_comfortzone_ex_fan_speed
        name: Lüfter

  - type: entities
    title: Kältekreis
    show_header_toggle: false
    entities:
      - entity: sensor.technikkeller_comfortzone_ex_high_pressure
        name: Hochdruck
      - entity: sensor.technikkeller_comfortzone_ex_low_pressure
        name: Niederdruck
      - entity: sensor.technikkeller_comfortzone_ex_pressure_ratio
        name: Druckverhältnis
      - entity: sensor.technikkeller_comfortzone_ex_condenser_temperature
        name: Kondensationstemperatur
      - entity: sensor.technikkeller_comfortzone_ex_superheat
        name: Überhitzung
      - entity: sensor.technikkeller_comfortzone_ex_target_superheat
        name: Überhitzung Soll
      - entity: sensor.technikkeller_comfortzone_ex_expansion_valve_position
        name: Expansionsventil

  - type: entities
    title: Luft und Durchfluss
    show_header_toggle: false
    entities:
      - entity: sensor.technikkeller_comfortzone_ex_fan_power
        name: Ventilatorleistung
      - entity: sensor.technikkeller_comfortzone_ex_filter_change_time
        name: Filterwechselzeit
      - entity: sensor.technikkeller_comfortzone_ex_heating_flow
        name: Heizungsdurchfluss
      - entity: sensor.technikkeller_comfortzone_ex_hot_water_flow
        name: Warmwasserdurchfluss

  - type: entities
    title: Energie und Laufzeit
    show_header_toggle: false
    entities:
      - entity: sensor.technikkeller_comfortzone_ex_compressor_energy
        name: Energie Kompressor
      - entity: sensor.technikkeller_comfortzone_ex_additional_heater_energy
        name: Energie Zusatzheizung
      - entity: sensor.technikkeller_comfortzone_ex_hot_water_energy
        name: Energie Warmwasser
      - entity: sensor.technikkeller_comfortzone_ex_compressor_runtime
        name: Laufzeit Kompressor
      - entity: sensor.technikkeller_comfortzone_ex_total_runtime
        name: Laufzeit gesamt
      - entity: binary_sensor.technikkeller_comfortzone_ex_rs485_bus_online
        name: RS485
