          border-right: "1px solid rgba(255, 100, 75, 0.5)"
          border-bottom: "1px solid rgba(255, 100, 75, 0.5)"
          border-radius: "0 0 8px 8px"
          box-sizing: border-box
          width: 19%
          padding: 4px 7px
