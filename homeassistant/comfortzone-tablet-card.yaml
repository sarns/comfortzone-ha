type: vertical-stack
cards:
  - type: picture-elements
    image: /local/comfortzone/comfortzone-ex-schema.png
    elements:
      - type: state-label
        entity: sensor.comfortzone_ex_outdoor_temperature
        prefix: "Außen: "
        tap_action:
          action: more-info
        style:
          left: 27%
          top: 12%
          color: "#8bdcff"
          background: "rgba(5, 18, 32, 0.9)"
          border: "1px solid rgba(139, 220, 255, 0.45)"
          border-radius: 7px
          padding: 4px 6px
          font-size: "clamp(9px, 1.4vw, 14px)"
          white-space: nowrap

      - type: state-label
        entity: sensor.comfortzone_ex_indoor_temperature
        prefix: "Raum: "
        tap_action:
          action: more-info
        style:
          left: 13%
          top: 33%
          color: "#ffffff"
          background: "rgba(5, 18, 32, 0.94)"
          border: "1px solid rgba(255, 255, 255, 0.35)"
          border-radius: "8px 8px 0 0"
          box-sizing: border-box
          width: 16%
          padding: 4px 7px
          font-size: "clamp(9px, 1.4vw, 14px)"
          text-align: left
          white-space: nowrap

      - type: state-label
        entity: sensor.comfortzone_ex_room_setpoint
        prefix: "Soll: "
        tap_action:
          action: more-info
        style:
          left: 13%
          top: 38%
          color: "#d9e8f5"
          background: "rgba(5, 18, 32, 0.94)"
          border-left: "1px solid rgba(255, 255, 255, 0.35)"
          border-right: "1px solid rgba(255, 255, 255, 0.35)"
          border-bottom: "1px solid rgba(255, 255, 255, 0.35)"
          border-radius: "0 0 8px 8px"
          box-sizing: border-box
          width: 16%
          padding: 4px 7px
          font-size: "clamp(9px, 1.4vw, 14px)"
          text-align: left
          white-space: nowrap

      - type: state-label
