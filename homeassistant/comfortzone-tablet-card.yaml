          border-radius: 7px
          padding: 4px 6px
          font-size: "clamp(9px, 1.4vw, 14px)"
          white-space: nowrap

      - type: state-label
        entity: sensor.comfortzone_ex_hot_gas_temperature
        prefix: "Heißgas: "
        tap_action:
          action: more-info
        style:
