          background: "rgba(5, 18, 32, 0.9)"
          border: "1px solid rgba(67, 170, 255, 0.5)"
          border-radius: 7px
          padding: 4px 6px
          font-size: "clamp(9px, 1.4vw, 14px)"
          white-space: nowrap

      - type: state-label
        entity: sensor.comfortzone_ex_hot_water_temperature
        prefix: "Warmwasser: "
        tap_action:
          action: more-info
        style:
          left: 88%
          top: 29%
          color: "#ffad93"
          background: "rgba(5, 18, 32, 0.94)"
          border: "1px solid rgba(255, 100, 75, 0.5)"
          border-radius: "8px 8px 0 0"
          box-sizing: border-box
          width: 18%
          padding: 4px 7px
          font-size: "clamp(9px, 1.4vw, 14px)"
          text-align: left
          white-space: nowrap

      - type: state-label
        entity: sensor.comfortzone_ex_hot_water_target
        prefix: "WW-Soll: "
        tap_action:
          action: more-info
        style:
          left: 88%
          top: 34%
          color: "#ffd4c9"
          background: "rgba(5, 18, 32, 0.94)"
          border-left: "1px solid rgba(255, 100, 75, 0.5)"
          border-right: "1px solid rgba(255, 100, 75, 0.5)"
          border-bottom: "1px solid rgba(255, 100, 75, 0.5)"
          border-radius: "0 0 8px 8px"
          box-sizing: border-box
          width: 18%
          padding: 4px 7px
          font-size: "clamp(9px, 1.4vw, 14px)"
          text-align: left
          white-space: nowrap

      - type: state-label
        entity: sensor.comfortzone_ex_total_output_power
        prefix: "Heizleistung: "
        tap_action:
          action: more-info
        style:
          left: 83%
          top: 75%
          color: "#ffd166"
          background: "rgba(5, 18, 32, 0.9)"
          border: "1px solid rgba(255, 209, 102, 0.45)"
          border-radius: 7px
          padding: 4px 6px
          font-size: "clamp(9px, 1.4vw, 14px)"
          white-space: nowrap

      - type: state-label
        entity: binary_sensor.comfortzone_ex_additional_heater_active
        prefix: "Zusatzheizung: "
        tap_action:
          action: more-info
        style:
          left: 68%
          top: 82%
          color: "#ffc778"
          background: "rgba(5, 18, 32, 0.94)"
          border: "1px solid rgba(255, 199, 120, 0.45)"
          border-radius: "8px 8px 0 0"
          box-sizing: border-box
          width: 19%
          padding: 4px 7px
          font-size: "clamp(9px, 1.4vw, 14px)"
          text-align: left
          white-space: nowrap

      - type: state-label
        entity: sensor.comfortzone_ex_additional_heater_power
        prefix: "Zusatzleistung: "
        tap_action:
          action: more-info
        style:
          left: 68%
          top: 87%
          color: "#ffd166"
          background: "rgba(5, 18, 32, 0.94)"
          border-left: "1px solid rgba(255, 199, 120, 0.45)"
          border-right: "1px solid rgba(255, 199, 120, 0.45)"
          border-bottom: "1px solid rgba(255, 199, 120, 0.45)"
          border-radius: "0 0 8px 8px"
          box-sizing: border-box
          width: 19%
          padding: 4px 7px
          font-size: "clamp(9px, 1.4vw, 14px)"
          text-align: left
          white-space: nowrap

  - type: grid
    columns: 2
    square: false
    cards:
      - type: entities
        title: Temperaturen
        show_header_toggle: false
        entities:
          - entity: sensor.comfortzone_ex_outdoor_temperature
            name: Außen
          - entity: sensor.comfortzone_ex_indoor_temperature
            name: Raum
          - entity: sensor.comfortzone_ex_room_setpoint
            name: Raum Soll
          - entity: sensor.comfortzone_ex_exhaust_air_temperature
            name: Abluft
          - entity: sensor.comfortzone_ex_evaporator_inlet_temperature
            name: Verdampfer Eingang
          - entity: sensor.comfortzone_ex_hot_gas_temperature
            name: Heißgas
          - entity: sensor.comfortzone_ex_exchanger_outlet_temperature
            name: Wärmetauscher Ausgang
          - entity: sensor.comfortzone_ex_flow_temperature
            name: Vorlauf
          - entity: sensor.comfortzone_ex_return_temperature
            name: Rücklauf
          - entity: sensor.comfortzone_ex_hot_water_temperature
            name: Warmwasser
          - entity: sensor.comfortzone_ex_hot_water_target
            name: Warmwasser Soll

      - type: entities
        title: Betrieb
        show_header_toggle: false
        entities:
          - entity: binary_sensor.comfortzone_ex_compressor_running
            name: Kompressor
          - entity: sensor.comfortzone_ex_compressor_frequency
            name: Frequenz
          - entity: sensor.comfortzone_ex_compressor_input_power
            name: Aufnahmeleistung
          - entity: sensor.comfortzone_ex_compressor_output_power
            name: Abgabeleistung
          - entity: sensor.comfortzone_ex_total_output_power
            name: Heizleistung
          - entity: binary_sensor.comfortzone_ex_additional_heater_active
            name: Zusatzheizung
          - entity: sensor.comfortzone_ex_additional_heater_power
            name: Zusatzleistung
          - entity: sensor.comfortzone_ex_fan_speed
            name: Lüfter

  - type: grid
    columns: 2
    square: false
    cards:
      - type: entities
        title: Energie
        show_header_toggle: false
        entities:
          - entity: sensor.comfortzone_ex_compressor_energy
            name: Kompressor
          - entity: sensor.comfortzone_ex_additional_heater_energy
            name: Zusatzheizung
          - entity: sensor.comfortzone_ex_hot_water_energy
            name: Warmwasser

      - type: entities
        title: Laufzeit und Verbindung
        show_header_toggle: false
        entities:
          - entity: sensor.comfortzone_ex_compressor_runtime
            name: Kompressor
          - entity: sensor.comfortzone_ex_total_runtime
            name: Gesamt
          - entity: binary_sensor.comfortzone_ex_rs485_bus_online
            name: RS485
