        # Haus und Abluft
        - type: state-label
          entity: sensor.comfortzone_ex_outdoor_temperature
          prefix: "Außen: "
          tap_action:
            action: more-info
          style:
            left: 31%
            top: 12%
            color: "#8bdcff"
            background: "rgba(5, 18, 32, 0.88)"
            border: "1px solid rgba(139, 220, 255, 0.45)"
            border-radius: 8px
            padding: 5px 9px
            font-size: "clamp(9px, 1vw, 15px)"
            white-space: nowrap

        - type: state-label
          entity: sensor.comfortzone_ex_indoor_temperature
          prefix: "Ist: "
          tap_action:
            action: more-info
          style:
            left: 13%
            top: 30.5%
            color: "#ffffff"
            background: "rgba(5, 18, 32, 0.94)"
            border: "1px solid rgba(255, 255, 255, 0.35)"
            border-radius: "10px 10px 0 0"
            box-sizing: border-box
            width: 15%
            padding: 7px 11px
            font-size: "clamp(9px, 1vw, 15px)"
            text-align: left
            white-space: nowrap

        - type: state-label
          entity: sensor.comfortzone_ex_room_setpoint
          prefix: "Soll: "
          tap_action:
